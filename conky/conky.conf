-- ─────────────────────────────────────────────────────────────────
--  Conky : Thème GitHub Dark : Ambiance Linux Mint
-- ─────────────────────────────────────────────────────────────────
conky.config = {

    -- ── Position ─────────────────────────────────────────────────
    alignment          = 'top_left',
    gap_x              = 18,
    gap_y              = 25,

    -- ── Fenêtre (transparence ARGB) ───────────────────────────────
    own_window             = true,
    own_window_type        = 'dock',
    own_window_hints       = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value  = 0,          -- 0=transparent, 255=opaque
    own_window_colour      = '000000',   -- ignoré (transparent)

    -- ── Rendu ────────────────────────────────────────────────────
    double_buffer      = true,
    draw_shades        = false,
    draw_outline       = false,
    draw_borders       = false,
    draw_graph_borders = false,
    border_width       = 0,

    -- ── Police ───────────────────────────────────────────────────
    use_xft            = true,
    font               = 'DejaVu Sans Mono:size=10',
    xftalpha           = 1,

    -- ── Palette (Linux Mint) ─────────────────────────────────────
    default_color = 'd4e8c2',  -- texte principal  (blanc légèrement vert)
    color1        = '9dd633',  -- vert Mint vif     (titres)
    color2        = '5a9930',  -- vert foncé       (bons niveaux)
    color3        = 'e8a838',  -- jaune-ocre       (niveaux moyens)
    color4        = 'e05050',  -- rouge doux       (niveaux élevés)
    color5        = '7a9468',  -- gris-vert        (labels discrets)
    color6        = 'b8dc6e',  -- vert clair Mint  (horloge)

    -- ── Rafraîchissement ─────────────────────────────────────────
    update_interval = 1.5,
    cpu_avg_samples = 3,
    net_avg_samples = 2,

    -- ── Mise en page ─────────────────────────────────────────────
    minimum_width    = 420,
    maximum_width    = 420,
    no_buffers       = true,
    short_units      = true,
    pad_percents     = 2,
    uppercase        = false,
    use_spacer       = 'none',
    text_buffer_size = 2048,
}

-- ─────────────────────────────────────────────────────────────────
conky.text = [[
  ${color1}${font DejaVu Sans Mono:bold:size=32}${time %H:%M:%S}${font}${color}
  ${color6}${time %A %-d %B %Y}${color}



${color1}${font DejaVu Sans Mono:bold:size=10}  MÉTÉO${font}${color5}
${execi 1800 python3 ~/.config/conky/weather.py}

${color1}${font DejaVu Sans Mono:bold:size=10}  SYSTÈME${font}${color}
${color5}  Uptime    ${color}${uptime}
${color5}  Kernel    ${color}${kernel}
${color5}  Charge    ${color}${loadavg 1} ${loadavg 2} ${loadavg 3}

${color1}${font DejaVu Sans Mono:bold:size=10}  CPU${font}  ${color5}i5-1135G7  (${freq_g}GHz)${color}
${color5}  Global ${color}${cpu cpu0}%   ${color5}Temp ${color}${execi 5 awk '{printf "%.0f°C", $1/1000}' /sys/class/thermal/thermal_zone0/temp}
${color5}  c1${color} ${cpu cpu1}%  ${color5}c2${color} ${cpu cpu2}%  ${color5}c3${color} ${cpu cpu3}%  ${color5}c4${color} ${cpu cpu4}%

${color1}${font DejaVu Sans Mono:bold:size=10}  MÉMOIRE${font}${color}
${color5}  RAM   ${color}${mem} / ${memmax}  ${color5}(${memperc}%)${color}
${color5}  Swap  ${color}${swap} / ${swapmax}  ${color5}(${swapperc}%)${color}

${color1}${font DejaVu Sans Mono:bold:size=10}  STOCKAGE${font}${color}
${color5}  /     ${color}${fs_used /} / ${fs_size /}  ${color5}(${fs_used_perc /}%)${color}
${color5}  /home ${color}${fs_used /home} / ${fs_size /home}  ${color5}(${fs_used_perc /home}%)${color}

${color1}${font DejaVu Sans Mono:bold:size=10}  RÉSEAU${font}  ${color5}wlp0s20f3${color}
${color5}  ↑ ${color}${upspeed wlp0s20f3}${color5}   ↓ ${color}${downspeed wlp0s20f3}
${color5}  IP locale   ${color}${addr wlp0s20f3}
${color5}  IP publique ${color}${execi 300 curl -4 -s --max-time 6 ifconfig.me 2>/dev/null || echo "indisponible"}

${color1}${font DejaVu Sans Mono:bold:size=10}  TOP PROCESSUS${font}${color}
${color5}  NOM                       PID        CPU%   MEM↓${color}
${execi 3 python3 ~/.config/conky/top_procs.py}
]]
